<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSR Summit 2025 — CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a1628;
      --bg2: #0f1e35;
      --bg3: #162340;
      --card: #1a2a45;
      --card2: #1f3154;
      --border: #2a3f60;
      --border2: #334d75;
      --cyan: #06b6d4;
      --cyan2: #0891b2;
      --cyan-glow: rgba(6, 182, 212, .18);
      --amber: #f59e0b;
      --amber2: #d97706;
      --amber-glow: rgba(245, 158, 11, .15);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, .15);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, .12);
      --purple: #8b5cf6;
      --text: #e2eaf4;
      --text2: #8fa8cc;
      --text3: #5a7aaa;
      --radius: 10px;
      --radius2: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg2);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 9px;
    }

    /* layout */
    .shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      min-width: 230px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-logo {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: .5px;
      line-height: 1.2;
    }

    .sidebar-logo p {
      font-size: 11px;
      color: var(--text3);
      margin-top: 3px;
      font-family: 'DM Mono', monospace;
    }

    .sidebar-status {
      margin: 12px 16px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.ok {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .status-dot.err {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }

    .status-text {
      font-size: 11px;
      color: var(--text2);
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 10px;
      overflow-y: auto;
    }

    .nav-section {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 10px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      background: none;
      color: var(--text2);
      cursor: pointer;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: all .15s;
      text-align: left;
      position: relative;
    }

    .nav-btn:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, .15), rgba(6, 182, 212, .05));
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, .25);
    }

    .nav-btn .icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    .nav-btn .badge {
      margin-left: auto;
      background: var(--cyan);
      color: var(--bg);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      font-family: 'DM Mono', monospace;
    }

    .main {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      max-height: 100vh;
    }

    /* topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .topbar h2 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .topbar .sub {
      font-size: 13px;
      color: var(--text3);
      margin-top: 2px;
    }

    /* stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 18px 20px;
      cursor: pointer;
      transition: all .2s;
    }

    .stat-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    .stat-card .sub-val {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    .v-cyan {
      color: var(--cyan);
    }

    .v-amber {
      color: var(--amber);
    }

    .v-green {
      color: var(--green);
    }

    .v-red {
      color: var(--red);
    }

    .v-purple {
      color: var(--purple);
    }

    /* cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 22px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* table */
    .tbl-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: var(--bg3);
    }

    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: .6px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255, 255, 255, .02);
    }

    .id-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 5px;
      display: inline-block;
    }

    .id-pre {
      background: rgba(6, 182, 212, .12);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, .25);
    }

    .id-win {
      background: rgba(245, 158, 11, .12);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, .25);
    }

    .id-grp {
      background: rgba(139, 92, 246, .12);
      color: var(--purple);
      border: 1px solid rgba(139, 92, 246, .25);
    }

    .id-spk {
      background: rgba(16, 185, 129, .12);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, .25);
    }

    /* badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
    }

    .b-green {
      background: var(--green-glow);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, .3);
    }

    .b-red {
      background: var(--red-glow);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, .25);
    }

    .b-amber {
      background: var(--amber-glow);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, .3);
    }

    .b-cyan {
      background: var(--cyan-glow);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, .3);
    }

    .b-purple {
      background: rgba(139, 92, 246, .12);
      color: var(--purple);
      border: 1px solid rgba(139, 92, 246, .3);
    }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-primary {
      background: var(--cyan);
      color: var(--bg);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--cyan2);
    }

    .btn-outline {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border2);
    }

    .btn-outline:hover {
      background: var(--card2);
      color: var(--text);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text3);
      border: none;
    }

    .btn-ghost:hover {
      color: var(--text);
    }

    .btn-green {
      background: var(--green);
      color: #fff;
      font-weight: 600;
    }

    .btn-green:hover {
      opacity: .9;
    }

    .btn-red {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, .3);
    }

    .btn-red:hover {
      background: var(--red-glow);
    }

    .btn-amber {
      background: var(--amber);
      color: var(--bg);
      font-weight: 600;
    }

    .btn-amber:hover {
      background: var(--amber2);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* search bar */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cyan);
    }

    .search-input::placeholder {
      color: var(--text3);
    }

    /* forms */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid.one {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--cyan);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group select option {
      background: var(--bg2);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .modal-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text3);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    /* toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }

    .toggle-label {
      font-size: 13px;
      color: var(--text2);
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border2);
      border-radius: 99px;
      cursor: pointer;
      transition: .2s;
    }

    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }

    .toggle input:checked+.toggle-slider {
      background: var(--cyan);
    }

    .toggle input:checked+.toggle-slider:before {
      transform: translateX(18px);
    }

    /* group member rows */
    .member-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 12px 0;
    }

    .member-row {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .member-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .member-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      font-family: 'DM Mono', monospace;
    }

    /* id lookup result */
    .lookup-result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 20px;
    }

    .lookup-person {
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 14px;
      background: var(--bg3);
      margin-top: 10px;
    }

    .lookup-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .lookup-meta {
      font-size: 12px;
      color: var(--text3);
      margin-top: 4px;
    }

    .lookup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .lookup-field {
      font-size: 12px;
    }

    .lookup-field .lf-key {
      color: var(--text3);
      margin-bottom: 1px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .lookup-field .lf-val {
      color: var(--text);
      font-weight: 500;
    }

    /* avatar */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* speaker card */
    .spk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .spk-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 20px;
      transition: all .2s;
    }

    .spk-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
    }

    .spk-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .spk-info h4 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .spk-info p {
      font-size: 12px;
      color: var(--text3);
      margin-top: 1px;
    }

    .spk-tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 99px;
      margin-bottom: 8px;
      background: rgba(6, 182, 212, .1);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, .25);
    }

    .spk-bio {
      font-size: 12px;
      color: var(--text3);
      line-height: 1.6;
    }

    /* export */
    .export-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .export-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }

    .export-card:hover {
      border-color: var(--cyan);
      background: var(--card2);
    }

    .export-icon {
      font-size: 28px;
    }

    .export-label {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .export-sub {
      font-size: 11px;
      color: var(--text3);
    }

    /* filter tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .ftab {
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      transition: all .15s;
    }

    .ftab:hover {
      border-color: var(--border2);
      color: var(--text);
    }

    .ftab.active {
      background: var(--cyan);
      color: var(--bg);
      border-color: var(--cyan);
      font-weight: 600;
    }

    /* info box */
    .info-box {
      background: rgba(6, 182, 212, .06);
      border: 1px solid rgba(6, 182, 212, .2);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.7;
    }

    .info-box strong {
      color: var(--cyan);
    }

    /* empty */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text3);
    }

    .empty .ei {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 13px;
    }

    /* responsive */
    @media(max-width:768px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text3);
      font-size: 13px;
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API = "http://localhost:8000";

    // ── helpers ─────────────────────────────────────────────────────────────────
    const api = async (path, opts = {}) => {
      try {
        const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
        return r.ok ? r.json() : null;
      } catch { return null; }
    };

    const avatarColors = ["#06b6d4", "#f59e0b", "#10b981", "#8b5cf6", "#ef4444", "#3b82f6", "#ec4899"];
    const avatarColor = (name = "") => avatarColors[name.charCodeAt(0) % avatarColors.length];
    const initials = (n = "") => n.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
    const fmtTime = (s) => s ? new Date(s).toLocaleString("en-IN", { dateStyle: "short", timeStyle: "short" }) : "—";
    const idClass = (id = "") =>
      id.startsWith("GRP") || id.startsWith("WGP") ? "id-grp" :
        id.startsWith("PRE") ? "id-pre" :
          id.startsWith("WIN") ? "id-win" :
            id.startsWith("SPK") ? "id-spk" : "id-pre";

    // ── ID LOOKUP ─────────────────────────────────────────────────────────────────
    function IDLookup() {
      const [q, setQ] = useState("");
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);

      const search = async () => {
        if (!q.trim()) return;
        setLoading(true);
        const r = await api(`/api/search?q=${encodeURIComponent(q.trim())}`);
        setResult(r);
        setLoading(false);
      };

      return (
        <div>
          <div className="topbar"><div><h2>🔍 ID Lookup</h2><div className="sub">Search any attendee by their unique ID</div></div></div>

          <div className="info-box" style={{ marginBottom: 20 }}>
            <strong>How to search:</strong> Type a full ID like <code style={{ fontFamily: "'DM Mono'", background: "rgba(255,255,255,.06)", padding: "1px 5px", borderRadius: 4 }}>PRE-0001</code> for an individual &nbsp;·&nbsp;
            Type a group prefix like <code style={{ fontFamily: "'DM Mono'", background: "rgba(255,255,255,.06)", padding: "1px 5px", borderRadius: 4 }}>GRP-001</code> to see all members of that group &nbsp;·&nbsp;
            Or type a name / organization for a name search
          </div>

          <div className="search-row">
            <input className="search-input" placeholder="e.g. PRE-0001 · GRP-001 · WIN-0004 · Company Name…"
              value={q} onChange={e => setQ(e.target.value)}
              onKeyDown={e => e.key === "Enter" && search()}
              style={{ fontFamily: "'DM Mono',monospace", fontSize: 14 }} />
            <button className="btn btn-primary" onClick={search}>Search</button>
            {result && <button className="btn btn-outline" onClick={() => { setResult(null); setQ(""); }}>Clear</button>}
          </div>

          {loading && <div className="loading pulse">Searching…</div>}

          {result && !loading && (
            <div className="lookup-result">
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                <div style={{ fontFamily: "'Syne',sans-serif", fontWeight: 700, fontSize: 15 }}>
                  {result.match_type === "group" && <span className="badge b-purple">👥 Group — {result.count} members</span>}
                  {result.match_type === "individual" && <span className="badge b-cyan">👤 Individual match</span>}
                  {result.match_type === "name_search" && <span className="badge b-amber">🔎 {result.count} name/org result(s)</span>}
                  {result.match_type === "none" && <span className="badge b-red">❌ No results found</span>}
                </div>
                <span style={{ fontSize: 12, color: "var(--text3)" }}>Query: <span style={{ fontFamily: "'DM Mono'", color: "var(--cyan)" }}>{result.query}</span></span>
              </div>
              {result.results && result.results.map(p => (
                <div key={p.id} className="lookup-person">
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
                    <div className="avatar" style={{ background: avatarColor(p.name) }}>{initials(p.name)}</div>
                    <div>
                      <div className="lookup-name">{p.name}</div>
                      <div className="lookup-meta">{p.designation} · {p.organization}</div>
                    </div>
                    <div style={{ marginLeft: "auto", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                      <span className={`id-badge ${idClass(p.id)}`}>{p.id}</span>
                      {p.group_id && <span className="badge b-purple" style={{ fontSize: 10 }}>👥 {p.group_id}</span>}
                    </div>
                  </div>
                  <div className="lookup-grid">
                    <div className="lookup-field"><div className="lf-key">Email</div><div className="lf-val">{p.email || "—"}</div></div>
                    <div className="lookup-field"><div className="lf-key">Phone</div><div className="lf-val">{p.phone || "—"}</div></div>
                    <div className="lookup-field"><div className="lf-key">Type</div><div className="lf-val">{p.type}</div></div>
                    <div className="lookup-field"><div className="lf-key">Status</div>
                      <div className="lf-val">
                        {p.checked_in
                          ? <span className="badge b-green">✅ Present · {fmtTime(p.check_in_time)}</span>
                          : <span className="badge b-red">⏳ Not Checked In</span>}
                      </div>
                    </div>
                    <div className="lookup-field"><div className="lf-key">Registered At</div><div className="lf-val">{fmtTime(p.registered_at)}</div></div>
                  </div>

              ))}

          )}

          {!result && !loading && (
            <div className="empty"><div className="ei">🔍</div><p>Enter an ID or name above to look up an attendee</p></div>
          )}
        </div>
      );
    }

    // ── PRE-REGISTRATION ──────────────────────────────────────────────────────────
    function AddPersonModal({ onClose, onAdded }) {
      const [isGroup, setIsGroup] = useState(false);
      const [org, setOrg] = useState("");
      const [form, setForm] = useState({ name: "", email: "", phone: "", organization: "", designation: "" });
      const [members, setMembers] = useState([{ name: "", email: "", phone: "", designation: "" }]);
      const [loading, setLoading] = useState(false);

      const addMember = () => setMembers(m => [...m, { name: "", email: "", phone: "", designation: "" }]);
      const removeMember = (i) => setMembers(m => m.filter((_, j) => j !== i));
      const setMember = (i, k, v) => setMembers(m => m.map((r, j) => j === i ? { ...r, [k]: v } : r));

      const submit = async () => {
        setLoading(true);
        let body;
        if (isGroup) {
          body = { is_group: true, group_organization: org, group_members: members.map(m => ({ ...m, organization: org })) };
        } else {
          body = { is_group: false, ...form };
        }
        const r = await api("/api/pre-registered", { method: "POST", body: JSON.stringify(body) });
        setLoading(false);
        if (r) { onAdded(r); onClose(); }
      };

      return (
        <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal">
            <div className="modal-header">
              <h3>➕ Add Pre-Registration</h3>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>
            <div className="toggle-row">
              <span className="toggle-label">👥 Group Registration</span>
              <label className="toggle"><input type="checkbox" checked={isGroup} onChange={e => setIsGroup(e.target.checked)} /><span className="toggle-slider" /></label>
              {isGroup && <span style={{ fontSize: 12, color: "var(--purple)" }}>IDs: GRP-XXX-01, GRP-XXX-02…</span>}
              {!isGroup && <span style={{ fontSize: 12, color: "var(--cyan)" }}>ID: PRE-XXXX</span>}
            </div>
            {isGroup ? (
              <>
                <div className="form-group" style={{ marginBottom: 14 }}>
                  <label>Organization (common for all)</label>
                  <input value={org} onChange={e => setOrg(e.target.value)} placeholder="Company / Organization" />
                </div>
                <div className="member-rows">
                  {members.map((m, i) => (
                    <div key={i} className="member-row">
                      <div className="member-row-header">
                        <span className="member-num">
                          MEMBER {String(i + 1).padStart(2, "0")} · ID will be GRP-XXX-{String(i + 1).padStart(2, "0")}
                        </span>
                        {i > 0 && <button className="btn btn-ghost btn-sm" onClick={() => removeMember(i)}>✕ Remove</button>}
                      </div>
                      <div className="form-grid">
                        <div className="form-group"><label>Name *</label><input value={m.name} onChange={e => setMember(i, "name", e.target.value)} placeholder="Full name" /></div>
                        <div className="form-group"><label>Designation</label><input value={m.designation} onChange={e => setMember(i, "designation", e.target.value)} placeholder="Job title" /></div>
                        <div className="form-group"><label>Email</label><input value={m.email} onChange={e => setMember(i, "email", e.target.value)} placeholder="email@example.com" /></div>
                        <div className="form-group"><label>Phone</label><input value={m.phone} onChange={e => setMember(i, "phone", e.target.value)} placeholder="+91 …" /></div>
                      </div>
                    </div>
                  ))}
                </div>
                <button className="btn btn-outline" style={{ width: "100%" }} onClick={addMember}>+ Add Member</button>
              </>
            ) : (
              <div className="form-grid">
                <div className="form-group"><label>Name *</label><input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Full name" /></div>
                <div className="form-group"><label>Email</label><input value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} placeholder="email@example.com" /></div>
                <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} placeholder="+91 …" /></div>
                <div className="form-group"><label>Organization</label><input value={form.organization} onChange={e => setForm(f => ({ ...f, organization: e.target.value }))} placeholder="Company" /></div>
                <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Designation</label><input value={form.designation} onChange={e => setForm(f => ({ ...f, designation: e.target.value }))} placeholder="Job title" /></div>
              </div>
            )}
            <div className="form-actions">
              <button className="btn btn-outline" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" onClick={submit} disabled={loading}>
                {loading ? "Saving…" : isGroup ? `Register ${members.length} Members` : "Register"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function PreRegistration({ onDataChange }) {
      const [data, setData] = useState([]);
      const [search, setSearch] = useState("");
      const [modal, setModal] = useState(false);
      const [loading, setLoading] = useState(true);

      const load = async () => { setLoading(true); const r = await api("/api/pre-registered"); if (r) setData(r); setLoading(false); };
      useEffect(() => { load(); }, []);

      const toggle = async (id) => {
        const r = await api(`/api/pre-registered/${id}`, { method: "PATCH" });
        if (r) { setData(d => d.map(p => p.id === id ? r : p)); onDataChange(); }
      };
      const del = async (id) => {
        if (!confirm("Delete this record?")) return;
        await api(`/api/pre-registered/${id}`, { method: "DELETE" });
        setData(d => d.filter(p => p.id !== id)); onDataChange();
      };

      const filtered = data.filter(p =>
        [p.name, p.email, p.organization, p.id, p.group_id || "", p.designation]
          .some(v => v.toLowerCase().includes(search.toLowerCase()))
      );

      const checked = data.filter(p => p.checked_in).length;

      return (
        <div>
          <div className="topbar">
            <div>
              <h2>📋 Pre-Registration</h2>
              <div className="sub">{data.length} registered · {checked} checked in · {data.length - checked} pending</div>
            </div>
            <button className="btn btn-primary" onClick={() => setModal(true)}>+ Add Registration</button>
          </div>
          <div className="search-row">
            <input className="search-input" placeholder="Search by name, ID, org, email…"
              value={search} onChange={e => setSearch(e.target.value)} />
            <span style={{ fontSize: 12, color: "var(--text3)", whiteSpace: "nowrap" }}>{filtered.length} shown</span>
          </div>
          <div className="card" style={{ padding: 0 }}>
            <div className="tbl-wrap">
              {loading ? <div className="loading pulse">Loading…</div> :
                filtered.length === 0 ? <div className="empty"><div className="ei">📋</div><p>No records match</p></div> :
                  <table>
                    <thead><tr>
                      <th>ID</th><th>Name</th><th>Organization</th><th>Designation</th><th>Contact</th><th>Status</th><th>Action</th>
                    </tr></thead>
                    <tbody>
                      {filtered.map(p => (
                        <tr key={p.id}>
                          <td>
                            <span className={`id-badge ${idClass(p.id)}`}>{p.id}</span>
                            {p.group_id && <div style={{ marginTop: 3 }}><span className="badge b-purple" style={{ fontSize: 10 }}>👥 {p.group_id}</span></div>}
                          </td>
                          <td>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <div className="avatar" style={{ width: 28, height: 28, fontSize: 11, background: avatarColor(p.name) }}>{initials(p.name)}</div>
                              <span style={{ fontWeight: 500 }}>{p.name}</span>
                            </div>
                          </td>
                          <td style={{ color: "var(--text2)" }}>{p.organization || "—"}</td>
                          <td style={{ color: "var(--text3)", fontSize: 12 }}>{p.designation || "—"}</td>
                          <td style={{ fontSize: 12, color: "var(--text3)" }}>{p.email || "—"}<br />{p.phone || ""}</td>
                          <td>
                            {p.checked_in
                              ? <span className="badge b-green">✅ Present</span>
                              : <span className="badge b-red">⏳ Pending</span>}
                          </td>
                          <td>
                            <div style={{ display: "flex", gap: 6 }}>
                              <button className={`btn btn-sm ${p.checked_in ? "btn-outline" : "btn-green"}`} onClick={() => toggle(p.id)}>
                                {p.checked_in ? "Undo" : "Check In"}
                              </button>
                              <button className="btn btn-sm btn-red" onClick={() => del(p.id)}>✕</button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>}
            </div>
          </div>
          {modal && <AddPersonModal onClose={() => setModal(false)} onAdded={() => { load(); onDataChange(); }} />}
        </div>
      );
    }

        setData([...(pre || []), ...(win || [])]);
      };
      useEffect(() => { load(); }, []);

      const toggle = async (p) => {
        const ep = p.type === "walk-in" ? "walk-ins" : "pre-registered";
        const r = await api(`/api/${ep}/${p.id}`, { method: "PATCH" });
        if (r) { setData(d => d.map(x => x.id === p.id ? r : x)); onDataChange(); }
      };

      const present = data.filter(p => p.checked_in).length;

      const filtered = data.filter(p => {
        const matchFilter = filter === "all" || (filter === "present" && p.checked_in) || (filter === "pending" && !p.checked_in);
        const matchSearch = !search || [p.name, p.organization, p.id, p.group_id || ""].some(v => v.toLowerCase().includes(search.toLowerCase()));
        return matchFilter && matchSearch;
      });

      return (
        <div>
          <div className="topbar">
            <div><h2>✅ Attendance</h2><div className="sub">{present}/{data.length} checked in · {data.length - present} pending</div></div>
          </div>
          <div className="stat-grid" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
            <div className="stat-card"><div className="label">Total</div><div className="value v-cyan">{data.length}</div></div>
            <div className="stat-card"><div className="label">✅ Present</div><div className="value v-green">{present}</div></div>
            <div className="stat-card"><div className="label">⏳ Pending</div><div className="value v-red">{data.length - present}</div></div>
          </div>
          <div className="search-row">
            <input className="search-input" placeholder="Search by name, ID, group ID, org…"
              value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          <div className="filter-tabs">
            {["all", "present", "pending"].map(f => (
              <button key={f} className={`ftab ${filter === f ? "active" : ""}`} onClick={() => setFilter(f)}>
                {f === "all" ? "All" : f === "present" ? "✅ Present" : "⏳ Pending"}
              </button>
            ))}
          </div>
          <div className="card" style={{ padding: 0 }}>
            <div className="tbl-wrap">
              {filtered.length === 0 ? <div className="empty"><div className="ei">✅</div><p>No attendees match</p></div> :
                <table>
                  <thead><tr><th>ID</th><th>Name</th><th>Org</th><th>Type</th><th>Status</th><th>Check-in Time</th><th>Action</th></tr></thead>
                  <tbody>
                    {filtered.map(p => (
                      <tr key={p.id}>
                        <td>
                          <span className={`id-badge ${idClass(p.id)}`}>{p.id}</span>
                          {p.group_id && <div style={{ marginTop: 3 }}><span className="badge b-purple" style={{ fontSize: 10 }}>👥 {p.group_id}</span></div>}
                        </td>
                        <td>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <div className="avatar" style={{ width: 26, height: 26, fontSize: 10, background: avatarColor(p.name) }}>{initials(p.name)}</div>
                            {p.name}
                          </div>
                        </td>
                        <td style={{ color: "var(--text3)", fontSize: 12 }}>{p.organization || "—"}</td>
                        <td><span className={`badge ${p.type === "walk-in" ? "b-amber" : "b-cyan"}`}>{p.type}</span></td>
                        <td>{p.checked_in ? <span className="badge b-green">✅ Present</span> : <span className="badge b-red">⏳ Pending</span>}</td>
                        <td style={{ fontSize: 11, color: "var(--text3)", fontFamily: "'DM Mono'" }}>{fmtTime(p.check_in_time)}</td>
                        <td>
                          <button className={`btn btn-sm ${p.checked_in ? "btn-outline" : "btn-green"}`} onClick={() => toggle(p)}>
                            {p.checked_in ? "Undo" : "Check In"}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>}
            </div>
          </div>
        </div>
      );
    }

    // ── SPEAKERS ──────────────────────────────────────────────────────────────────
    function Speakers({ onDataChange }) {
      const [data, setData] = useState([]);
      const [modal, setModal] = useState(false);
      const [form, setForm] = useState({ name: "", designation: "", organization: "", topic: "", session_time: "", bio: "" });

      const load = async () => { const r = await api("/api/speakers"); if (r) setData(r); };
      useEffect(() => { load(); }, []);

      const submit = async () => {
        const r = await api("/api/speakers", { method: "POST", body: JSON.stringify(form) });
        if (r) { setModal(false); setForm({ name: "", designation: "", organization: "", topic: "", session_time: "", bio: "" }); load(); onDataChange(); }
      };
      const del = async (id) => {
        if (!confirm("Remove speaker?")) return;
        await api(`/api/speakers/${id}`, { method: "DELETE" });
        setData(d => d.filter(s => s.id !== id)); onDataChange();
      };

      return (
        <div>
          <div className="topbar">
            <div><h2>🎤 Speakers</h2><div className="sub">{data.length} speakers added</div></div>
            <button className="btn btn-primary" onClick={() => setModal(true)}>+ Add Speaker</button>
          </div>
          {data.length === 0 ? <div className="empty"><div className="ei">🎤</div><p>No speakers added yet</p></div> :
            <div className="spk-grid">
              {data.map(s => (
                <div key={s.id} className="spk-card">
                  <div className="spk-head">
                    <div className="avatar" style={{ background: avatarColor(s.name), width: 44, height: 44, fontSize: 16 }}>{initials(s.name)}</div>
                    <div className="spk-info">
                      <h4>{s.name}</h4>
                      <p>{s.designation}</p>
                      <p style={{ color: "var(--text3)" }}>{s.organization}</p>
                    </div>
                    <div style={{ marginLeft: "auto", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
                      <span className={`id-badge id-spk`}>{s.id}</span>
                      <button className="btn btn-sm btn-red" onClick={() => del(s.id)}>✕</button>
                    </div>
                  </div>
                  <div className="spk-tag">🎯 {s.topic}</div>
                  <div style={{ fontSize: 12, color: "var(--cyan)", marginBottom: 6 }}>🕐 {s.session_time}</div>
                  {s.bio && <div className="spk-bio">{s.bio}</div>}
                </div>
              ))}
            </div>}
          {modal && (
            <div className="modal-bg" onClick={e => e.target === e.currentTarget && setModal(false)}>
              <div className="modal">
                <div className="modal-header"><h3>🎤 Add Speaker</h3><button className="modal-close" onClick={() => setModal(false)}>✕</button></div>
                <div className="form-grid">
                  {[["name", "Name *"], ["designation", "Designation"], ["organization", "Organization"], ["topic", "Talk Topic"], ["session_time", "Session Time"]].map(([k, l]) => (
                    <div key={k} className="form-group"><label>{l}</label>
                      <input value={form[k]} onChange={e => setForm(f => ({ ...f, [k]: e.target.value }))} placeholder={l} />
                    </div>
                  ))}
                  <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Bio</label>
                    <textarea value={form.bio} onChange={e => setForm(f => ({ ...f, bio: e.target.value }))} placeholder="Short bio…" />
                  </div>
                </div>
                <div className="form-actions">
                  <button className="btn btn-outline" onClick={() => setModal(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={submit}>Add Speaker</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
    function ExcelExport() {
      const exports = [
        { type: "all", icon: "📊", label: "Full Export", sub: "All 5 sheets in one file" },
        { type: "attendees", icon: "👥", label: "All Attendees", sub: "Pre-reg + Walk-ins combined" },
        { type: "preregistered", icon: "📋", label: "Pre-Registered", sub: "150 pre-reg attendees" },
        { type: "walkins", icon: "🚶", label: "Walk-Ins", sub: "On-spot registrations" },
        { type: "attendance", icon: "✅", label: "Attendance Sheet", sub: "Check-in status + time" },
        { type: "speakers", icon: "🎤", label: "Speakers", sub: "Speaker profiles & sessions" },
      ];
      return (
        <div>
          <div className="topbar"><div><h2>⬇ Excel Export</h2><div className="sub">Download data as formatted .xlsx files</div></div></div>
          <div className="info-box" style={{ marginBottom: 22 }}>
            All exports include <strong>column headers with dark navy styling</strong>, all fields, and timestamps.
            Files are named <strong>CSR_Summit_[type]_[datetime].xlsx</strong>
          </div>
          <div className="export-grid">
            {exports.map(e => (
              <div key={e.type} className="export-card" onClick={() => window.open(`${API}/api/export/excel?type=${e.type}`)}>
                <div className="export-icon">{e.icon}</div>
                <div className="export-label">{e.label}</div>
                <div className="export-sub">{e.sub}</div>
                <button className="btn btn-outline btn-sm" style={{ pointerEvents: "none" }}>⬇ Download .xlsx</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── APP SHELL ─────────────────────────────────────────────────────────────────
    const TABS = [
      { id: "dash", icon: "🏠", label: "Dashboard" },
      { id: "lookup", icon: "🔍", label: "ID Lookup" },
      { id: "pre", icon: "📋", label: "Pre-Registration" },
      { id: "walkin", icon: "🚶", label: "Walk-In" },
      { id: "attendance", icon: "✅", label: "Attendance" },
      { id: "speakers", icon: "🎤", label: "Speakers" },
      { id: "export", icon: "⬇", label: "Excel Export" },
    ];

    function App() {
      const [tab, setTab] = useState("dash");
      const [stats, setStats] = useState({});
      const [online, setOnline] = useState(null);

      const loadStats = useCallback(async () => {
        const r = await api("/api/stats");
        if (r) { setStats(r); setOnline(true); } else setOnline(false);
      }, []);

      useEffect(() => { loadStats(); }, []);

      return (
        <div className="shell">
          <aside className="sidebar">
            <div className="sidebar-logo">
              <h1>CSR Summit 2025</h1>
              <p>Event CRM · June 5</p>
            </div>
            <div className="sidebar-status">
              <div className={`status-dot ${online === null ? "" : online ? "ok" : "err"}`} />
              <span className="status-text">
                {online === null ? "Connecting…" : online ? "Backend connected" : "Backend offline"}
              </span>
            </div>
            <nav className="sidebar-nav">
              <div className="nav-section">Navigation</div>
              {TABS.map(t => (
                <button key={t.id} className={`nav-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
                  <span className="icon">{t.icon}</span>
                  <span>{t.label}</span>
                  {t.id === "pre" && stats.pre_registered && <span className="badge">{stats.pre_registered}</span>}
                  {t.id === "walkin" && stats.walk_ins > 0 && <span className="badge" style={{ background: "var(--amber)" }}>{stats.walk_ins}</span>}
                  {t.id === "attendance" && stats.pending > 0 && <span className="badge" style={{ background: "var(--red)" }}>{stats.pending}</span>}
                </button>
              ))}
            </nav>
            <div style={{ padding: "12px 16px", borderTop: "1px solid var(--border)", fontSize: 11, color: "var(--text3)" }}>
              🌐 Backend: <span style={{ fontFamily: "'DM Mono'", color: "var(--cyan)" }}>localhost:8000</span>
            </div>
          </aside>
          <main className="main">
            {tab === "dash" && <Dashboard stats={stats} setTab={setTab} />}
            {tab === "lookup" && <IDLookup />}
            {tab === "pre" && <PreRegistration onDataChange={loadStats} />}
            {tab === "walkin" && <WalkIn onDataChange={loadStats} />}
            {tab === "attendance" && <Attendance onDataChange={loadStats} />}
            {tab === "speakers" && <Speakers onDataChange={loadStats} />}
            {tab === "export" && <ExcelExport />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
